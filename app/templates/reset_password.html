<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — AIAssistedShop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main>
    <section>
        <h1>Reset Password</h1>
        <form id="reset-password-form">
            <div class="form-group">
                <label for="new-password">New password</label>
                <input id="new-password" type="password" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm new password</label>
                <input id="confirm-password" type="password" autocomplete="new-password" required>
            </div>
            <button type="submit">Reset password</button>
        </form>
        <p id="reset-message" role="status"></p>
        <p><a href="/">Return to login</a></p>
    </section>
</main>
<script>
const resetToken = {{ token|tojson }};
const form = document.getElementById("reset-password-form");
const message = document.getElementById("reset-message");

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = document.getElementById("new-password").value;
    const confirmation = document.getElementById("confirm-password").value;

    if (!resetToken) {
        message.textContent = "This password-reset link is invalid or missing a token.";
        return;
    }
    if (password !== confirmation) {
        message.textContent = "The passwords do not match.";
        return;
    }

    const response = await fetch("/api/auth/password-reset/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: resetToken, new_password: password })
    });
    const data = await response.json();
    message.textContent = response.ok
        ? "Your password has been reset. You can now log in."
        : (data.error || "Unable to reset password. Request a new link and try again.");
    if (response.ok) {
        form.reset();
        form.querySelector("button").disabled = true;
    }
});
</script>
</body>
</html>
