name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests with branch coverage
        id: run_tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          python -m pytest tests/unit tests/integration \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            2>&1 | tee result.txt

      - name: Explain the failure with Claude
        id: explain_failure
        if: failure()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          curl -fsSL https://claude.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"

          claude -p \
            "Summarize why these tests failed and propose the smallest fix. Do not edit files." \
            --tools "" \
            --output-format json \
            < result.txt > report.json

      - name: Upload Claude failure report
        if: always() && steps.explain_failure.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: claude-failure-report
          path: report.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: ignore
